<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Itečka AI Chat</title>
    <style>
        /* --- 1. DIZAJN A ŠTÝLY (CSS) --- */
        body { 
            font-family: sans-serif; 
            background-color: #ffb7ce;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.3) 15%, transparent 16%),
                linear-gradient(135deg, #ffb7ce, #a2d2ff);
            background-size: 30px 30px, 100% 100%;
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }

        /* Väčší biely nadpis */
        h1 {
            color: white;
            font-size: 3.5em;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        p { color: white; font-weight: bold; margin-bottom: 30px; }

        .student-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; max-width: 1100px; margin: 20px auto; 
        }

        .card { 
            background: white; padding: 20px; border-radius: 15px; 
            transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.15); }
        
        /* HRANATÉ FOTKY (zmenené z 50% na 10%) */
        .card img { 
            width: 120px; 
            height: 120px; 
            border-radius: 10px; 
            object-fit: cover; 
            margin-bottom: 10px; 
        }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 1000;
        }

        .chat-box { 
            background: white; width: 350px; margin: 80px auto; 
            border-radius: 20px; overflow: hidden; display: flex; 
            flex-direction: column; height: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: left;
        }

        #msgs { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fefefe; }
        .m { padding: 10px 14px; border-radius: 18px; font-size: 14px; max-width: 85%; line-height: 1.4; }
        .user { align-self: flex-end; background: #a2d2ff; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: #f1f1f1; color: #333; border-bottom-left-radius: 2px; }

        .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 5px; }
        input[type="text"], textarea { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-family: sans-serif; }
        
        button { cursor: pointer; border: none; border-radius: 8px; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-chat { background: #a2d2ff; color: white; padding: 8px 15px; }
        .btn-edit { background: #eee; color: #666; padding: 8px 15px; }
        .btn-save { background: #c8b6ff; color: white; padding: 12px; width: 100%; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- --- 2. VIDITEĽNÝ OBSAH STRÁNKY --- -->
    <h1>Classmates AI Hub</h1>
    <p>Chat with your friends or reprogram their personality!</p>
    
    <div id="container" class="student-list"></div>

    <!-- OKNO PRE CHAT -->
    <div id="chat-modal" class="modal">
        <div class="chat-box">
            <div style="padding: 15px; background: #a2d2ff; color: white; display: flex; justify-content: space-between; font-weight: bold;">
                <span id="chat-name">Chat</span>
                <span onclick="closeChat()" style="cursor:pointer">✕</span>
            </div>
            <div id="msgs"></div>
            <div class="input-area">
                <input type="text" id="inp" placeholder="Type a message..." onkeypress="if(event.key==='Enter') send()">
            </div>
        </div>
    </div>

    <!-- OKNO PRE ÚPRAVU BIO -->
    <div id="bio-modal" class="modal">
        <div class="chat-box" style="height: auto; margin-top: 150px;">
            <div style="padding: 15px; background: #c8b6ff; color: white; display: flex; justify-content: space-between; font-weight: bold;">
                <span>Update Personality</span>
                <span onclick="closeBioModal()" style="cursor:pointer">✕</span>
            </div>
            <div style="padding: 25px; text-align: left;">
                <label id="bio-target-name" style="display: block; margin-bottom: 10px; font-size: 14px; color: #666;"></label>
                <textarea id="bio-input" style="width: 100%; height: 100px; box-sizing: border-box; margin-bottom: 20px; padding: 12px; border-radius: 15px; border: 1px solid #ddd; resize: none;"></textarea>
                <button onclick="saveBio()" class="btn-save">SAVE CHANGES</button>
            </div>
        </div>
    </div>

    <!-- --- 3. LOGIKA (JAVASCRIPT) --- -->
    <script>
        const URL = "https://peakbackend-2.onrender.com/api"; 
        let currentChatName = "";
        let currentEditId = null;

        async function start() {
            try {
                const res = await fetch(URL);
                const data = await res.json();
                const cont = document.getElementById('container');
                cont.innerHTML = ""; 
                
                data.students.forEach(s => {
                    const d = document.createElement('div');
                    d.className = 'card';
                    d.innerHTML = `
                        <img src="${s.image}">
                        <h3>${s.name} ${s.surname}</h3>
                        <p style="color: #888; font-size: 0.9em; margin-bottom: 15px;">@${s.nickname}</p>
                        <div style="display: flex; gap: 5px; justify-content: center;">
                            <button class="btn-chat" onclick="openChat('${s.name}')">Chat</button>
                            <button class="btn-edit" onclick="openBioModal(${s.id}, '${s.name} ${s.surname}', '${s.bio ? s.bio.replace(/'/g, "\\'") : ''}')">Edit Bio</button>
                        </div>
                    `;
                    cont.appendChild(d);
                });
            } catch (e) {
                document.getElementById('container').innerHTML = "Failed to connect to backend... 🔧";
            }
        }

        function openChat(name) {
            currentChatName = name;
            document.getElementById('chat-name').innerText = "Chat with " + name;
            document.getElementById('msgs').innerHTML = `<div class="m ai">Hi! I'm ${name}. How are you today?</div>`;
            document.getElementById('chat-modal').style.display = 'block';
        }

        function closeChat() { document.getElementById('chat-modal').style.display = 'none'; }

        async function send() {
            const inp = document.getElementById('inp');
            const txt = inp.value;
            if(!txt) return;

            const box = document.getElementById('msgs');
            box.innerHTML += `<div class="m user">${txt}</div>`;
            inp.value = "";
            box.scrollTop = box.scrollHeight; 
            
            try {
                const res = await fetch(`${URL}/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: currentChatName, message: txt})
                });
                const data = await res.json();
                box.innerHTML += `<div class="m ai">${data.reply}</div>`;
            } catch (e) {
                box.innerHTML += `<div class="m ai">My brain is lagging... check connection.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        function openBioModal(id, name, oldBio) {
            currentEditId = id;
            document.getElementById('bio-target-name').innerText = "Editing personality for " + name + ":";
            document.getElementById('bio-input').value = oldBio; 
            document.getElementById('bio-modal').style.display = 'block';
        }

        function closeBioModal() { document.getElementById('bio-modal').style.display = 'none'; }

        async function saveBio() {
            const newBio = document.getElementById('bio-input').value;
            if (!newBio) return;

            try {
                const res = await fetch(`${URL}/update_bio`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: currentEditId, bio: newBio })
                });
                
                if(res.ok) {
                    alert("Personality reprogrammed! 🧠✨");
                    closeBioModal();
                    start();
                }
            } catch (e) {
                alert("Database update failed.");
            }
        }

        start();
    </script>
</body>
</html>
